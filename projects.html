<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="wrap">
  <div class="nav-row">
    <a class="mark" href="index.html">Congling Tang</a>
    <nav>
      <a href="index.html">About</a>
      <a href="projects.html" class="active">Projects</a>
      <!-- <a href="resume.html">Resume</a> -->
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="page-head">
    <p class="role-line">Full list</p>
    <h1>Projects</h1>
    <p>Everything I've built, logged in one place — including the ones still in progress.</p>
  </div>

  <section id="projects" style="padding-top: 20px;">
    <div class="section-head">
      <h2>All projects</h2>
      <span class="count" id="project-count"></span>
    </div>

    <div id="project-list"></div>
    <div class="empty-note" id="empty-note" style="display:none;">Coming soon — full write-ups are in progress.</div>
    <p class="empty-note" id="more-note" style="display:none;">More projects coming soon.</p>
  </section>

</main>

<footer class="wrap">
  <p>Built with a plain HTML/CSS template · hosted on GitHub Pages</p>
</footer>

<script>
  /* ================================================================
     FULL PROJECT LIST — every project goes here.
     (index.html has its own short preview list.)
     ================================================================ */
  const projects = [
    // TO ADD A PROJECT: copy the block below, delete the "//" at the start of
    // each line, and edit the text. "url" is the folder you made in Project/
    // (keep the trailing slash). Put a comma between projects.
    //
    // {
    //   title: "Your Project Title",
    //   description: "One plain sentence about what it is.",
    //   tags: ["Mechanical", "Firmware"],
    //   url: "Project/your-folder-name/"
    // },
      {
      title: "F.R.P.S.",
      description: "Enable a robot to plan safe, collision-aware motions in a changing workspace.",
       tags: ["ROS", "MoveIt", "Computer Vision"],
       url: "Project/FRPS/index.html"
      },
      {
      title: "Custom 3D Lidar Scanner",
      description: "Turn a cheap 2D Lidar into a 3D scanner with a custom mechanical design and firmware.",
       tags: ["Mechanical", "Firmware", "Electronics"],
       url: "Project/3Dlidar/index.html"
      },
      {
      title: "Corne Keyboard",
      description: "Soldering, assembling, and flashing firmware for a custom mechanical keyboard.",
       tags: ["Mechanical", "Firmware", "Electronics"],
       url: "Project/CorneKeyboard/index.html"
      },
  ];

  const list = document.getElementById('project-list');
  const countEl = document.getElementById('project-count');
  const emptyNote = document.getElementById('empty-note');

  countEl.textContent = projects.length ? String(projects.length).padStart(2, '0') + ' total' : '';
  if (!projects.length) emptyNote.style.display = 'block';
  if (projects.length) document.getElementById('more-note').style.display = 'block';

  projects.forEach((p, i) => {
    const el = p.url ? document.createElement('a') : document.createElement('div');
    el.className = 'project';
    if (p.url) {
      el.href = p.url;
      // Only external links (https://...) open in a new tab; your own project pages open in the same tab
      if (/^https?:\/\//.test(p.url)) { el.target = '_blank'; el.rel = 'noopener'; }
    }
    el.innerHTML = `
      <span class="index">${String(i + 1).padStart(2, '0')}</span>
      <div class="body">
        <h3>${p.title}</h3>
        <p>${p.description}</p>
        <div class="tags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>
      </div>
      <span class="go">${p.url ? 'View →' : ''}</span>
    `;
    list.appendChild(el);
  });
</script>

</body>
</html>
